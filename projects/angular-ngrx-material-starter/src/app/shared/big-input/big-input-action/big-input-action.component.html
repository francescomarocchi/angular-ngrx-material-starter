<button mat-raised-button color="color" [disabled]="disabled()" (click)="onClick()">
  @if (fontSet() && fontIcon() && !faIcon()) {
    <mat-icon [fontSet]="fontSet()" [fontIcon]="fontIcon()" />
  }
  @if (faIcon()) {
    <fa-icon [icon]="faIcon()" />
  }
  @if (label()) {
    <span>{{label()}}</span>
  }
</button>
